spring.application.name=futstars-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/futstars_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORDs}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080